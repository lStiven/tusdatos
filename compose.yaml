# Local stack built from this repository's images: PostgreSQL, migrations, API and web.
# Development happens in the Dev Container (.devcontainer/compose.yaml), not here.
name: mis-eventos-local

x-backend: &backend
  build:
    context: backend
    target: runtime
  env_file: backend/.env
  environment:
    POSTGRES_HOST: postgres
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    env_file: backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once before the API: a single migration step, never one per API replica.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"

  # The app on http://localhost:8080; nginx proxies /api to the `api` service.
  web:
    build:
      context: frontend
      target: runtime
      args:
        VITE_ENABLE_LAB: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

  # Only on demand: docker compose run --rm --build tests
  tests:
    <<: *backend
    build:
      context: backend
      target: test
    profiles: [test]

volumes:
  postgres-data:
