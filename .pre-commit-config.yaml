# Hooks de pre-commit — Mis Eventos
# https://pre-commit.com/

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend --frozen ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/

      - id: ruff-format
        name: ruff format
        entry: uv run --project backend --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/

      - id: pyright
        name: pyright
        entry: uv run --directory backend --frozen pyright
        language: system
        types_or: [python, pyi]
        files: ^backend/
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check --directory backend
        language: system
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: just --justfile backend/justfile test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown --ignore-path frontend/.prettierignore
        language: system
        files: ^frontend/
        types: [text]

      - id: oxlint
        name: oxlint
        entry: frontend/node_modules/.bin/oxlint --deny-warnings -c frontend/.oxlintrc.json
        language: system
        files: ^frontend/src/
        types_or: [ts, tsx]

      - id: tsc
        name: tsc
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        types_or: [ts, tsx, json]
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]
